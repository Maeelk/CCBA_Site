# Worker « Aube » — assistant du site de la CCBA. Déploiement : voir worker/README.md
name = "ccba-assistant"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# Modèle préféré. Si ce nom n'existe pas, le Worker essaie automatiquement les modèles voisins
# (gemini-3.x flash-lite / flash, puis 2.5, puis 2.0). GET /models liste ceux qu'offre la clé.
MODEL = "gemini-3.1-flash-lite"
KB_URL = "https://maeelk.github.io/CCBA_Site/assets/data/kb.txt"
ALLOWED_ORIGINS = "https://maeelk.github.io,http://localhost:8765,http://127.0.0.1:8765"
MAX_PER_HOUR = "40"

# Pas de clé API Google ici : chaque visiteur apporte la sienne (voir worker/README.md).
# Optionnel, pour un repli côté serveur si un visiteur n'a pas de clé :
#   npx wrangler secret put GEMINI_KEY
